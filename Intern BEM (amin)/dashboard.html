<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
      body {
        font-family: "Inter", sans-serif;
      }

      .font-heading {
        font-family: "DM Sans", sans-serif;
      }
    </style>
    <title>Dasbor</title>
  </head>
  <body
    class="hidden isolate min-h-screen bg-gradient-to-br from-[#120a20] via-[#291641] to-[#401d5e]"
  >
    <div
      aria-hidden="true"
      class="pointer-events-none fixed -inset-[20%] -z-10 origin-center bg-[radial-gradient(ellipse_at_20%_30%,rgba(192,132,252,0.25),transparent_42%),radial-gradient(ellipse_at_75%_65%,rgba(96,165,250,0.2),transparent_44%),radial-gradient(ellipse_at_55%_15%,rgba(232,121,249,0.14),transparent_40%)] blur-[28px] animate-[spin_60s_linear_infinite] motion-reduce:animate-none"
    ></div>
    <header
      class="border-b border-purple-300/25 bg-gradient-to-r from-[#322344]/95 via-[#25213a]/95 to-[#1d3042]/95 px-4 py-3 shadow-lg shadow-purple-950/30 sm:py-4"
    >
      <nav class="mx-auto flex max-w-6xl flex-col gap-3 sm:flex-row sm:items-center sm:justify-between sm:gap-4">
        <p
          class="font-heading min-w-0 break-words text-lg font-semibold text-fuchsia-200 drop-shadow-[0_0_12px_rgba(232,121,249,0.9)] sm:text-2xl"
        >
          Hello <span id="username"></span>!
        </p>
        <div class="grid grid-cols-2 items-center gap-2 sm:flex sm:gap-4">
          <p class="font-heading hidden text-lg font-semibold text-purple-200 sm:block">
            Dasbor
          </p>
          <button
            type="button"
            onclick="BukaFormTugas()"
            class="min-h-11 rounded-lg bg-gradient-to-r from-fuchsia-600 to-violet-600 px-3 py-2 text-sm font-semibold text-white shadow-lg shadow-fuchsia-950/30 transition hover:from-fuchsia-500 hover:to-violet-500 sm:px-4"
          >
            + Tambah Tugas
          </button>
          <button
            type="button"
            onclick="LogOut()"
            class="min-h-11 rounded-lg border border-red-400/40 px-3 py-2 text-sm font-semibold text-red-300 transition hover:bg-red-400/10"
          >
            Log out
          </button>
        </div>
      </nav>
    </header>

    <main class="mx-auto min-h-[calc(100vh-73px)] max-w-6xl p-4 py-8 sm:p-8">
      <div class="mb-6">
        <h1 class="font-heading text-3xl font-bold text-purple-200">Daftar Tugas</h1>
        <p class="mt-2 text-purple-100/70">
          Atur dan pantau tugas Anda di sini.
        </p>
      </div>
      <p
        id="empty-message"
        class="rounded-xl border border-purple-300/20 bg-[#170e26]/80 p-6 text-center text-purple-100/70"
      >
        Belum ada tugas. Tekan "Tambah Tugas" untuk membuat tugas pertama.
      </p>
      <div id="task-list" class="grid items-start gap-6 sm:grid-cols-2 xl:grid-cols-3"></div>
    </main>

    <div
      id="logout-confirmation"
      class="fixed inset-0 z-10 flex hidden items-center justify-center bg-black/70 p-4"
      role="dialog"
      aria-modal="true"
      aria-labelledby="logout-title"
    >
      <div
        class="w-full max-w-sm rounded-2xl border border-purple-300/20 bg-[#170e26] p-6 text-center shadow-2xl shadow-purple-950/60"
      >
        <h2 id="logout-title" class="mb-3 text-xl font-bold text-purple-200">
          Konfirmasi log out
        </h2>
        <p class="mb-6 text-purple-100/70">Apakah Anda yakin ingin log out?</p>
        <div class="flex justify-center gap-3">
          <button
            type="button"
            onclick="TutupKonfirmasi()"
            class="rounded-lg border border-purple-300/30 px-4 py-2 font-semibold text-purple-200 transition hover:bg-purple-300/10"
          >
            Batal
          </button>
          <button
            type="button"
            onclick="KonfirmasiLogOut()"
            class="rounded-lg bg-gradient-to-r from-fuchsia-600 to-violet-600 px-4 py-2 font-semibold text-white transition hover:from-fuchsia-500 hover:to-violet-500"
          >
            Ya, log out
          </button>
        </div>
      </div>
    </div>

    <div
      id="task-modal"
      class="fixed inset-0 z-20 flex hidden items-start justify-center overflow-y-auto bg-black/70 p-3 sm:items-center sm:p-4"
      role="dialog"
      aria-modal="true"
      aria-labelledby="task-modal-title"
    >
      <form
        id="task-form"
        onsubmit="SimpanTugas(event)"
        class="my-0 max-h-[calc(100dvh-1.5rem)] w-full max-w-lg overflow-y-auto overscroll-contain rounded-2xl border border-purple-300/20 bg-[#170e26] p-5 shadow-2xl shadow-purple-950/60 sm:my-auto sm:max-h-[calc(100dvh-2rem)] sm:p-8"
      >
        <h2
          id="task-modal-title"
          class="mb-6 text-2xl font-bold text-purple-200"
        >
          Tambah Tugas
        </h2>
        <input id="task-id" type="hidden" />

        <label
          for="task-name"
          class="mb-2 block text-sm font-medium text-purple-100"
        >
          Nama tugas
        </label>
        <input
          id="task-name"
          type="text"
          required
          maxlength="80"
          placeholder="Contoh: Selesaikan laporan"
          class="mb-4 w-full rounded-lg border border-purple-300/25 bg-[#10091c] px-4 py-3 text-purple-50 placeholder:text-purple-200/35 outline-none focus:border-fuchsia-400 focus:ring-4 focus:ring-fuchsia-400/15"
        />

        <label
          for="task-description"
          class="mb-2 block text-sm font-medium text-purple-100"
        >
          Deskripsi
        </label>
        <textarea
          id="task-description"
          rows="3"
          placeholder="Tambahkan detail tugas"
          class="mb-4 w-full resize-y rounded-lg border border-purple-300/25 bg-[#10091c] px-4 py-3 text-purple-50 placeholder:text-purple-200/35 outline-none focus:border-fuchsia-400 focus:ring-4 focus:ring-fuchsia-400/15"
        ></textarea>

        <label
          for="task-due-date"
          class="mb-2 block text-sm font-medium text-purple-100"
        >
          Tenggat waktu
        </label>
        <input
          id="task-due-date"
          type="date"
          required
          class="mb-5 w-full rounded-lg border border-purple-300/25 bg-[#10091c] px-4 py-3 text-purple-50 outline-none focus:border-fuchsia-400 focus:ring-4 focus:ring-fuchsia-400/15"
        />

        <fieldset class="mb-6">
          <legend class="mb-3 text-sm font-medium text-purple-100">
            Subtugas (opsional)
          </legend>
          <div class="flex gap-2">
            <input
              id="subtask-name"
              type="text"
              maxlength="80"
              placeholder="Tambahkan subtugas"
              class="min-w-0 flex-1 rounded-lg border border-purple-300/25 bg-[#10091c] px-4 py-2 text-purple-50 placeholder:text-purple-200/35 outline-none focus:border-fuchsia-400 focus:ring-4 focus:ring-fuchsia-400/15"
            />
            <button
              type="button"
              onclick="TambahSubtugasForm()"
              class="rounded-lg border border-purple-300/30 px-3 py-2 text-sm font-semibold text-purple-200 transition hover:bg-purple-300/10"
            >
              Tambah
            </button>
          </div>
          <ul id="subtask-form-list" class="mt-3 space-y-2"></ul>
        </fieldset>

        <fieldset class="mb-6">
          <legend class="mb-3 text-sm font-medium text-purple-100">
            Status
          </legend>
          <div class="grid gap-2 sm:grid-cols-3">
            <label
              class="flex cursor-pointer items-center gap-2 rounded-lg border border-gray-400/30 bg-gray-500/10 p-3 text-sm text-gray-300 transition-all duration-200 ease-out hover:-translate-y-0.5 hover:border-gray-300/60 hover:bg-gray-500/20 hover:brightness-125 hover:shadow-md has-checked:border-gray-300/70 has-checked:bg-gray-500/30 has-checked:text-gray-100 has-checked:shadow-md motion-reduce:transition-none motion-reduce:hover:translate-y-0"
            >
              <input
                type="radio"
                name="task-status"
                value="Belum Mulai"
                checked
                class="accent-gray-400"
              />
              Belum Mulai
            </label>
            <label
              class="flex cursor-pointer items-center gap-2 rounded-lg border border-purple-400/30 bg-purple-500/10 p-3 text-sm text-purple-300 transition-all duration-200 ease-out hover:-translate-y-0.5 hover:border-purple-300/60 hover:bg-purple-500/20 hover:brightness-125 hover:shadow-md has-checked:border-violet-300/70 has-checked:bg-violet-500/30 has-checked:text-violet-100 has-checked:shadow-md motion-reduce:transition-none motion-reduce:hover:translate-y-0"
            >
              <input
                type="radio"
                name="task-status"
                value="Dalam Proses"
                class="accent-violet-400"
              />
              Dalam Proses
            </label>
            <label
              class="flex cursor-pointer items-center gap-2 rounded-lg border border-green-400/30 bg-green-500/10 p-3 text-sm text-green-300 transition-all duration-200 ease-out hover:-translate-y-0.5 hover:border-green-300/60 hover:bg-green-500/20 hover:brightness-125 hover:shadow-md has-checked:border-green-300/70 has-checked:bg-green-500/25 has-checked:text-green-100 has-checked:shadow-md motion-reduce:transition-none motion-reduce:hover:translate-y-0"
            >
              <input
                type="radio"
                name="task-status"
                value="Selesai"
                class="accent-green-400"
              />
              Selesai
            </label>
          </div>
        </fieldset>

        <div class="flex flex-col-reverse gap-3 sm:flex-row sm:justify-end">
          <button
            type="button"
            onclick="TutupFormTugas()"
            class="min-h-11 w-full rounded-lg border border-purple-300/30 px-4 py-2 font-semibold text-purple-200 transition hover:bg-purple-300/10 sm:w-auto"
          >
            Batal
          </button>
          <button
            type="submit"
            class="min-h-11 w-full rounded-lg bg-gradient-to-r from-fuchsia-600 to-violet-600 px-4 py-2 font-semibold text-white transition hover:from-fuchsia-500 hover:to-violet-500 sm:w-auto"
          >
            Simpan Tugas
          </button>
        </div>
      </form>
    </div>

    <div
      id="delete-confirmation"
      class="fixed inset-0 z-30 flex hidden items-center justify-center bg-black/70 p-4"
      role="dialog"
      aria-modal="true"
      aria-labelledby="delete-title"
    >
      <div
        class="w-full max-w-sm rounded-2xl border border-purple-300/20 bg-[#170e26] p-6 text-center shadow-2xl shadow-purple-950/60"
      >
        <h2 id="delete-title" class="mb-3 text-xl font-bold text-purple-200">
          Hapus tugas?
        </h2>
        <p class="mb-6 text-purple-100/70">
          Tugas ini akan dihapus secara permanen.
        </p>
        <div class="flex justify-center gap-3">
          <button
            type="button"
            onclick="TutupKonfirmasiHapus()"
            class="rounded-lg border border-purple-300/30 px-4 py-2 font-semibold text-purple-200 transition hover:bg-purple-300/10"
          >
            Batal
          </button>
          <button
            type="button"
            onclick="KonfirmasiHapusTugas()"
            class="rounded-lg bg-red-500 px-4 py-2 font-semibold text-white transition hover:bg-red-400"
          >
            Hapus
          </button>
        </div>
      </div>
    </div>

    <script>
      const currentUsername = localStorage.getItem("currentUser");

      if (!currentUsername) {
        window.location.replace("index.html");
      } else {
        document.getElementById("username").textContent = currentUsername;
        document.body.classList.remove("hidden");
      }

      window.addEventListener("pageshow", function () {
        if (!localStorage.getItem("currentUser")) {
          window.location.replace("index.html");
        }
      });

      const taskStorageKey = "tasks_" + (currentUsername || "").toLowerCase();
      let tasks = currentUsername
        ? JSON.parse(localStorage.getItem(taskStorageKey) || "[]")
        : [];
      let taskToDelete = "";
      let subtasksForForm = [];

      function LogOut() {
        document
          .getElementById("logout-confirmation")
          .classList.remove("hidden");
      }

      function TutupKonfirmasi() {
        document.getElementById("logout-confirmation").classList.add("hidden");
      }

      function KonfirmasiLogOut() {
        localStorage.removeItem("currentUser");
        window.location.replace("index.html");
      }

      function BukaFormTugas(taskId) {
        const form = document.getElementById("task-form");
        const modalTitle = document.getElementById("task-modal-title");
        const hiddenTaskId = document.getElementById("task-id");

        form.reset();
        hiddenTaskId.value = "";
        subtasksForForm = [];
        TampilkanSubtugasForm();
        modalTitle.textContent = "Tambah Tugas";

        if (taskId) {
          const selectedTask = tasks.find(function (task) {
            return task.id === taskId;
          });

          if (selectedTask) {
            hiddenTaskId.value = selectedTask.id;
            document.getElementById("task-name").value = selectedTask.name;
            document.getElementById("task-description").value =
              selectedTask.description;
            document.getElementById("task-due-date").value =
              selectedTask.dueDate;
            subtasksForForm = Array.isArray(selectedTask.subtasks)
              ? selectedTask.subtasks.map(function (subtask) {
                  return {
                    name: subtask.name,
                    completed: Boolean(subtask.completed),
                  };
                })
              : [];
            TampilkanSubtugasForm();
            modalTitle.textContent = "Ubah Tugas";

            const statusInputs = document.querySelectorAll(
              'input[name="task-status"]',
            );
            statusInputs.forEach(function (radio) {
              radio.checked = radio.value === selectedTask.status;
            });
          }
        }

        document.getElementById("task-modal").classList.remove("hidden");
        document.getElementById("task-name").focus();
      }

      function TutupFormTugas() {
        document.getElementById("task-modal").classList.add("hidden");
      }

      function SimpanTugas(event) {
        event.preventDefault();

        const taskId = document.getElementById("task-id").value;
        const selectedStatus = document.querySelector(
          'input[name="task-status"]:checked',
        ).value;

        const task = {
          id: taskId || String(Date.now()),
          name: document.getElementById("task-name").value.trim(),
          description: document.getElementById("task-description").value.trim(),
          dueDate: document.getElementById("task-due-date").value,
          status: selectedStatus,
          subtasks: subtasksForForm.map(function (subtask) {
            return {
              name: subtask.name,
              completed: subtask.completed,
            };
          }),
        };

        const taskIndex = tasks.findIndex(function (item) {
          return item.id === taskId && taskId !== "";
        });

        if (taskIndex >= 0) {
          tasks[taskIndex] = task;
        } else {
          tasks.push(task);
        }

        localStorage.setItem(taskStorageKey, JSON.stringify(tasks));
        TutupFormTugas();
        TampilkanTugas();
      }

      function BuatElemen(tagName, classNames, text) {
        const element = document.createElement(tagName);
        element.className = classNames;
        element.textContent = text;
        return element;
      }

      function TampilkanSubtugasForm() {
        const subtaskList = document.getElementById("subtask-form-list");
        subtaskList.innerHTML = "";

        subtasksForForm.forEach(function (subtask, index) {
          const item = BuatElemen(
            "li",
            "flex items-center justify-between gap-3 rounded-lg border border-purple-300/20 bg-[#10091c] px-3 py-2",
            "",
          );
          const label = BuatElemen(
            "label",
            "flex min-w-0 flex-1 items-center gap-2 text-sm text-purple-100",
            "",
          );
          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.checked = subtask.completed;
          checkbox.className = "accent-fuchsia-400";
          checkbox.addEventListener("change", function () {
            subtask.completed = checkbox.checked;
          });

          const name = BuatElemen(
            "span",
            "break-words",
            subtask.name,
          );
          label.appendChild(checkbox);
          label.appendChild(name);

          const removeButton = BuatElemen(
            "button",
            "shrink-0 rounded-md border border-red-400/30 px-2 py-1 text-xs font-semibold text-red-300 transition hover:bg-red-400/10",
            "Hapus",
          );
          removeButton.type = "button";
          removeButton.addEventListener("click", function () {
            subtasksForForm.splice(index, 1);
            TampilkanSubtugasForm();
          });

          item.appendChild(label);
          item.appendChild(removeButton);
          subtaskList.appendChild(item);
        });
      }

      function TambahSubtugasForm() {
        const input = document.getElementById("subtask-name");
        const name = input.value.trim();

        if (!name) {
          input.focus();
          return;
        }

        subtasksForForm.push({
          name: name,
          completed: false,
        });
        input.value = "";
        TampilkanSubtugasForm();
        input.focus();
      }

      function BukaKonfirmasiHapus(taskId) {
        taskToDelete = taskId;
        document
          .getElementById("delete-confirmation")
          .classList.remove("hidden");
      }

      function TutupKonfirmasiHapus() {
        taskToDelete = "";
        document.getElementById("delete-confirmation").classList.add("hidden");
      }

      function KonfirmasiHapusTugas() {
        tasks = tasks.filter(function (task) {
          return task.id !== taskToDelete;
        });

        localStorage.setItem(taskStorageKey, JSON.stringify(tasks));
        TutupKonfirmasiHapus();
        TampilkanTugas();
      }

      function MulaiDrag(event) {
        event.dataTransfer.effectAllowed = "move";
        event.dataTransfer.setData("text/plain", event.currentTarget.id);
      }

      function IzinkanDrop(event) {
        event.preventDefault();
        event.dataTransfer.dropEffect = "move";
        event.currentTarget.classList.add("ring-2", "ring-fuchsia-300/40", "bg-purple-300/10");
      }

      function DragKeluar(event) {
        event.currentTarget.classList.remove("ring-2", "ring-fuchsia-300/40", "bg-purple-300/10");
      }

      function DropTugas(event) {
        event.preventDefault();
        const targetColumn = event.currentTarget;
        targetColumn.classList.remove("ring-2", "ring-fuchsia-300/40", "bg-purple-300/10");

        const taskId = event.dataTransfer.getData("text/plain");
        const newStatus = targetColumn.dataset.kategori;
        const task = tasks.find(function (item) {
          return item.id === taskId;
        });

        if (!task || task.status === newStatus) {
          return;
        }

        task.status = newStatus;
        localStorage.setItem(taskStorageKey, JSON.stringify(tasks));
        TampilkanTugas();
      }

      function TampilkanTugas() {
        const taskList = document.getElementById("task-list");
        const emptyMessage = document.getElementById("empty-message");
        const categories = ["Belum Mulai", "Dalam Proses", "Selesai"];
        const categoryLists = {};

        taskList.innerHTML = "";
        emptyMessage.classList.toggle("hidden", tasks.length > 0);
        taskList.classList.toggle("hidden", tasks.length === 0);

        categories.forEach(function (category) {
          const section = BuatElemen(
            "section",
            "min-h-[20rem] rounded-xl border border-transparent p-3 transition-colors",
            "",
          );

          section.dataset.kategori = category;
          section.addEventListener("dragover", IzinkanDrop);
          section.addEventListener("dragleave", DragKeluar);
          section.addEventListener("drop", DropTugas);

          const categoryTasks = tasks.filter(function (task) {
            return task.status === category;
          });

          const heading = BuatElemen(
            "h2",
            "border-b border-purple-300/20 pb-2 text-xl font-bold text-purple-200",
            category + " (" + categoryTasks.length + ")",
          );
          const categoryList = BuatElemen("div", "mt-4 grid gap-4", "");

          categoryLists[category] = categoryList;
          section.appendChild(heading);
          section.appendChild(categoryList);

          if (categoryTasks.length === 0) {
            categoryList.appendChild(
              BuatElemen(
                "p",
                "text-sm text-purple-100/50",
                "Belum ada tugas di kategori ini.",
              ),
            );
          }

          taskList.appendChild(section);
        });

        tasks.sort(function (taskA, taskB) {
          return taskA.dueDate.localeCompare(taskB.dueDate);
        });

        tasks.forEach(function (task) {
          let statusClass = "bg-gray-500/20 text-gray-300";
          let cardGradientClass =
            "from-[#4b5563]/75 via-[#374151]/80 to-[#1f2937]/85";

          if (task.status === "Dalam Proses") {
            statusClass = "bg-purple-500/20 text-purple-300";
            cardGradientClass =
              "from-[#684b91]/80 via-[#442e68]/80 to-[#27213f]/85";
          } else if (task.status === "Selesai") {
            statusClass = "bg-green-500/20 text-green-300";
            cardGradientClass =
              "from-[#315c4d]/80 via-[#1f493f]/80 to-[#17352f]/85";
          }

          const card = BuatElemen(
            "article",
            "rounded-xl border border-purple-300/25 bg-gradient-to-br " +
              cardGradientClass +
            " cursor-grab p-4 shadow-lg shadow-purple-950/30 backdrop-blur-sm transition-all duration-300 ease-out hover:border-fuchsia-300/50 hover:shadow-xl hover:shadow-fuchsia-900/40 active:cursor-grabbing sm:p-5 sm:hover:z-10 sm:hover:scale-[1.03]",
            "",
          );

          card.id = task.id;
          card.draggable = true;
          card.addEventListener("dragstart", MulaiDrag);

          const title = BuatElemen(
            "h2",
            "break-words text-xl font-semibold text-purple-100",
            task.name,
          );
          const status = BuatElemen(
            "span",
            "inline-block rounded-full px-3 py-1 text-sm font-medium " +
              statusClass,
            task.status,
          );
          const description = BuatElemen(
            "p",
            "my-4 min-h-6 whitespace-pre-wrap break-words text-sm text-purple-100/70",
            task.description || "Tidak ada deskripsi.",
          );
          const dueDate = new Date(
            task.dueDate + "T00:00:00",
          ).toLocaleDateString("id-ID");
          const dueDateText = BuatElemen(
            "p",
            "mb-4 text-sm text-purple-100/60",
            "Tenggat: " + dueDate,
          );
          const subtasks = Array.isArray(task.subtasks) ? task.subtasks : [];
          const subtaskSection = BuatElemen(
            "div",
            "mb-4 space-y-2",
            "",
          );

          if (subtasks.length > 0) {
            subtaskSection.appendChild(
              BuatElemen(
                "p",
                "text-sm font-semibold text-purple-200",
                "Subtugas",
              ),
            );

            subtasks.forEach(function (subtask) {
              const label = BuatElemen(
                "label",
                "flex items-start gap-2 text-sm text-purple-100/80",
                "",
              );
              const checkbox = document.createElement("input");
              checkbox.type = "checkbox";
              checkbox.checked = Boolean(subtask.completed);
              checkbox.className = "mt-1 accent-fuchsia-400";
              checkbox.setAttribute(
                "aria-label",
                "Selesaikan subtugas: " + subtask.name,
              );

              const subtaskName = BuatElemen(
                "span",
                "break-words",
                subtask.name,
              );
              subtaskName.classList.toggle("line-through", checkbox.checked);
              subtaskName.classList.toggle("opacity-50", checkbox.checked);

              checkbox.addEventListener("change", function () {
                subtask.completed = checkbox.checked;
                subtaskName.classList.toggle("line-through", checkbox.checked);
                subtaskName.classList.toggle("opacity-50", checkbox.checked);
                localStorage.setItem(taskStorageKey, JSON.stringify(tasks));
              });

              label.appendChild(checkbox);
              label.appendChild(subtaskName);
              subtaskSection.appendChild(label);
            });
          }

          const buttons = BuatElemen("div", "flex gap-2", "");

          const editButton = BuatElemen(
            "button",
            "min-h-11 flex-1 rounded-lg border border-purple-300/30 px-3 py-2 text-sm font-semibold text-purple-200 transition hover:bg-purple-300/10",
            "Ubah",
          );
          editButton.type = "button";
          editButton.addEventListener("click", function () {
            BukaFormTugas(task.id);
          });

          const deleteButton = BuatElemen(
            "button",
            "min-h-11 flex-1 rounded-lg border border-red-400/30 px-3 py-2 text-sm font-semibold text-red-300 transition hover:bg-red-400/10",
            "Hapus",
          );
          deleteButton.type = "button";
          deleteButton.addEventListener("click", function () {
            BukaKonfirmasiHapus(task.id);
          });

          buttons.appendChild(editButton);
          buttons.appendChild(deleteButton);
          card.appendChild(title);
          card.appendChild(status);
          card.appendChild(description);
          card.appendChild(dueDateText);
          card.appendChild(subtaskSection);
          card.appendChild(buttons);
          categoryLists[task.status].appendChild(card);
        });
      }

      TampilkanTugas();
    </script>
  </body>
</html>
