<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Masuk</title>
  </head>
  <body
    class="flex min-h-screen items-center justify-center bg-gradient-to-br from-[#0b0615] via-[#1d1033] to-[#31134a] p-4"
  >
    <main
      class="w-full max-w-md rounded-2xl border border-purple-300/20 bg-[#170e26]/95 p-8 shadow-2xl shadow-purple-950/60 sm:p-10"
    >
      <h1
        class="mb-2 text-3xl font-bold tracking-tight text-purple-200 drop-shadow-[0_0_12px_rgba(192,132,252,0.65)]"
      >
        Masuk
      </h1>
      <p class="mb-8 text-purple-100/60">
        Selamat datang kembali. Silakan masukkan detail akun Anda.
      </p>

      <form class="space-y-5" onsubmit="Pengecekan(event)">
        <div>
          <label
            for="username"
            class="mb-2 block text-sm font-medium text-purple-100"
            >Nama pengguna</label
          >

          <input
            id="username"
            type="text"
            placeholder="Nama pengguna Anda"
            class="w-full rounded-lg border border-purple-300/25 bg-[#10091c] px-4 py-3 text-purple-50 placeholder:text-purple-200/35 outline-none transition focus:border-fuchsia-400 focus:ring-4 focus:ring-fuchsia-400/15"
          />
          <p class="text-sm text-red-400 hidden">Kolom ini wajib diisi</p>
        </div>
        <div>
          <label
            for="password"
            class="mb-2 block text-sm font-medium text-purple-100"
            >Kata sandi</label
          >

          <input
            id="password"
            type="password"
            placeholder="Kata sandi Anda"
            class="w-full rounded-lg border border-purple-300/25 bg-[#10091c] px-4 py-3 text-purple-50 placeholder:text-purple-200/35 outline-none transition focus:border-fuchsia-400 focus:ring-4 focus:ring-fuchsia-400/15"
          />
          <p class="text-sm text-red-400 hidden">Kolom ini wajib diisi</p>
        </div>
        <button
          type="submit"
          class="w-full rounded-lg bg-gradient-to-r from-fuchsia-600 to-violet-600 px-4 py-3 font-semibold text-white shadow-lg shadow-fuchsia-950/40 transition hover:from-fuchsia-500 hover:to-violet-500 focus:outline-none focus:ring-4 focus:ring-fuchsia-400/25"
        >
          Masuk ke Dasbor
        </button>
      </form>

      <p class="mt-4 text-center text-sm text-red-400 hidden" id="login-error">
        Nama pengguna atau kata sandi salah.
      </p>
      <p
        class="mt-4 text-center text-sm text-green-400 hidden"
        id="login-success"
      >
        Login berhasil!
      </p>

      <div class="mt-6 flex items-center justify-between text-sm">
        <a
          href="#"
          class="font-medium text-purple-300 transition hover:text-fuchsia-200 hover:drop-shadow-[0_0_8px_rgba(232,121,249,0.65)]"
          >Lupa kata sandi?</a
        >
        <a
          href="signup.html"
          class="font-medium text-purple-300 transition hover:text-fuchsia-200 hover:drop-shadow-[0_0_8px_rgba(232,121,249,0.65)]"
          >Daftar</a
        >
      </div>
    </main>
    <script>
      const usernameInput = document.getElementById("username");
      const passwordInput = document.getElementById("password");

      function showFieldError(input, errorElement, shouldShow) {
        input.classList.toggle("border-red-400", shouldShow);
        errorElement.classList.toggle("hidden", !shouldShow);
      }

      function Pengecekan(event) {
        event.preventDefault();

        const username = usernameInput.value.trim();
        const password = passwordInput.value.trim();
        const usernameError = usernameInput.nextElementSibling;
        const passwordError = passwordInput.nextElementSibling;
        const loginError = document.getElementById("login-error");
        const loginSuccess = document.getElementById("login-success");

        loginError.classList.add("hidden");
        loginSuccess.classList.add("hidden");

        let hasEmptyField = false;

        if (username === "") {
          showFieldError(usernameInput, usernameError, true);
          hasEmptyField = true;
        } else {
          showFieldError(usernameInput, usernameError, false);
        }

        if (password === "") {
          showFieldError(passwordInput, passwordError, true);
          hasEmptyField = true;
        } else {
          showFieldError(passwordInput, passwordError, false);
        }

        if (hasEmptyField) {
          return;
        }

        const users = JSON.parse(localStorage.getItem("users") || "[]");
        const matchingUser = users.find(function (user) {
          return (
            user.username.trim().toLowerCase() === username.toLowerCase() &&
            user.password === password
          );
        });

        if (!matchingUser) {
          loginError.classList.remove("hidden");
          return;
        }

        localStorage.setItem("currentUser", matchingUser.username);
        loginSuccess.classList.remove("hidden");

        setTimeout(function () {
          window.location.href = "dashboard.html";
        }, 1200);
      }
    </script>
  </body>
</html>
